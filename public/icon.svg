<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2317" />
      <stop offset="50%" stop-color="#08170f" />
      <stop offset="100%" stop-color="#050e09" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />
  
  <!-- Outer Sacred Zen Orbit -->
  <circle cx="256" cy="256" r="180" stroke="#10b981" stroke-width="4" stroke-dasharray="10 14" opacity="0.4" />
  <circle cx="256" cy="256" r="140" stroke="#f59e0b" stroke-width="6" opacity="0.75" />
  
  <!-- Compass Axes -->
  <line x1="256" y1="90" x2="256" y2="422" stroke="#10b981" stroke-width="3" opacity="0.3" />
  <line x1="90" y1="256" x2="422" y2="256" stroke="#10b981" stroke-width="3" opacity="0.3" />

  <!-- Center Card Crest & Lotus Symbol -->
  <rect x="180" y="160" width="152" height="192" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="5" />
  
  <!-- Card Ace of Spades & Gold Crown -->
  <text x="256" y="240" font-family="system-ui, sans-serif" font-size="64" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">♠</text>
  <text x="256" y="300" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#d97706" text-anchor="middle">1000</text>
  
  <!-- Corner Orbs -->
  <circle cx="256" cy="116" r="14" fill="#f59e0b" />
  <circle cx="396" cy="256" r="14" fill="#10b981" />
  <circle cx="256" cy="396" r="14" fill="#38bdf8" />
  <circle cx="116" cy="256" r="14" fill="#f43f5e" />
</svg>
