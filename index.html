  <head>
    <script>
      (function() {
        var RealWebSocket = window.WebSocket;
        if (typeof RealWebSocket !== 'undefined') {
          class MockHmrSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = url;
              this.protocols = protocols;
              this.readyState = RealWebSocket.OPEN;
              this.OPEN = RealWebSocket.OPEN;
              this.CONNECTING = RealWebSocket.CONNECTING;
              this.CLOSING = RealWebSocket.CLOSING;
              this.CLOSED = RealWebSocket.CLOSED;
              this.binaryType = 'blob';
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              setTimeout(() => {
                const openEv = new Event('open');
                this.dispatchEvent(openEv);
                if (typeof this.onopen === 'function') this.onopen(openEv);

                const msgEv = new MessageEvent('message', {
                  data: JSON.stringify({ type: 'connected' })
                });
                this.dispatchEvent(msgEv);
                if (typeof this.onmessage === 'function') this.onmessage(msgEv);
              }, 10);
            }
            send() {}
            close() {}
          }

          function PatchedWebSocket(url, protocols) {
            const isHmr = (protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && url.includes('token=') && !url.includes('/api/ws'));
            if (isHmr) {
              return new MockHmrSocket(url, protocols);
            }
            return new RealWebSocket(url, protocols);
          }

          PatchedWebSocket.prototype = RealWebSocket.prototype;
          PatchedWebSocket.CONNECTING = RealWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = RealWebSocket.OPEN;
          PatchedWebSocket.CLOSING = RealWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = RealWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        function shouldIgnore(msg, file) {
          var str = String(msg || '') + ' ' + String(file || '');
          return str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('vite-hmr') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (e && shouldIgnore(e.message, e.filename)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && shouldIgnore(e.reason, '')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
